<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil — CSC Père Berthier Tuléar</title>
  <meta name="description" content="Centre Socio-Culturel à Madagascar dédié à la solidarité, au développement humain et au soutien des communautés locales depuis 2018.">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,800;1,300;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --forest: #1a3a2a;
      --leaf: #2d6a4f;
      --mint: #52b788;
      --sand: #f8f3e8;
      --clay: #c47c2b;
      --terracotta: #d4572a;
      --charcoal: #1c1c1c;
      --mist: #eaf4ee;
      --white: #ffffff;
      --text-muted: #6b7c74;
      --border: rgba(45, 106, 79, 0.15);
      --transition: 0.3s ease;
      --shadow-sm: 0 4px 24px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 16px 48px rgba(45, 106, 79, 0.12);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    *{
          box-sizing:border-box;
    }

    html,body{
          width:100%;
          overflow-x:hidden;
    }

    .container{
          width:100%;
          max-width:1200px;
          margin:auto;
          padding:0 20px;
    }
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--sand);
      color: var(--charcoal);
      overflow-x: hidden;
    }

    /* LOADER */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--sand);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--leaf);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
   
    /* REVEAL */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: none;
    }
    .rd1 {
      transition-delay: .1s;
    }
    .rd2 {
      transition-delay: .2s;
    }
    .rd3 {
      transition-delay: .3s;
    }
    .rd4 {
      transition-delay: .4s;
    }
    .rd5 {
      transition-delay: .5s;
    }
    .rd6 {
      transition-delay: .6s;
    }
 
    /* PAGE TRANSITION */
    #app {
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    #app.fading {
      opacity: 0;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 5%;
      background: rgba(248, 243, 232, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: box-shadow var(--transition);
    }
    nav.scrolled {
      box-shadow: var(--shadow-sm);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
      text-decoration: none;
    }
    .nav-image {
      width: 70px;
      height: 70px;
      display: flex;
      flex-shrink: 0;
    }
    .nav-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .nav-brand-text {
      font-family: 'Fraunces', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--forest);
      line-height: 1.15;
    }
    .nav-brand-text span {
      display: block;
      font-size: 0.68rem;
      font-weight: 300;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.08em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color var(--transition);
      letter-spacing: 0.02em;
      cursor: pointer;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--leaf);
      transition: width var(--transition);
    }
    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--leaf);
    }
    .nav-donate {
      background: var(--terracotta) !important;
      color: var(--white) !important;
      padding: 0.55rem 1.4rem !important;
      border-radius: 100px !important;
      font-weight: 600 !important;
    }
    .nav-donate::after {
      display: none !important;
    }
    .nav-donate:hover {
      background: var(--clay) !important;
      transform: translateY(-1px);
    }
    /* --- STYLE DU BOUTON BURGER (PAR DÉFAUT CACHÉ SUR PC) --- */
.hamburger {
  display: none; /* Caché sur ordinateur */
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
  z-index: 1000; /* Reste bien au-dessus du menu */
}

.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--charcoal);
  transition: all 0.3s ease; /* Animation fluide */
  border-radius: 2px;
}

/* --- ANIMATION : TRANSFORMATION EN "X" QUAND IL A LA CLASSE .open --- */
/* La barre du haut tourne à 45 degrés */
.hamburger.open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

/* La barre du milieu disparaît */
.hamburger.open span:nth-child(2) {
  opacity: 0;
}

/* La barre du bas tourne à -45 degrés */
.hamburger.open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}
    .hamburger.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.open span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      border: none;
      font-family: 'Outfit', sans-serif;
    }
    .btn-primary {
      background: var(--mint);
      color: var(--forest);
    }
    .btn-primary:hover {
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(82, 183, 136, 0.4);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-forest {
      background: var(--forest);
      color: var(--white);
    }
    .btn-forest:hover {
      background: var(--leaf);
      transform: translateY(-2px);
    }

    /* SECTION */
    .section {
      padding: 6rem 5%;
    }
    .section-alt {
      background: var(--mist);
    }
    .section-dark {
      background: var(--forest);
    }
    .section-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--leaf);
      margin-bottom: 0.8rem;
    }
    .section-eyebrow::before {
      content: '';
      display: block;
      width: 24px;
      height: 2px;
      background: var(--mint);
      border-radius: 2px;
    }
    .section-dark .section-eyebrow {
      color: var(--mint);
    }
    .section-h2 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--forest);
    }
    .section-h2 em {
      font-style: italic;
      font-weight: 300;
    }
    .section-dark .section-h2 {
      color: var(--white);
    }
    .section-desc {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text-muted);
      max-width: 580px;
      margin-top: 0.8rem;
    }

    /* HERO */
    .hero {
      min-height:100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      overflow: hidden;
      height:auto;
    }
    .hero-left {
      background: var(--forest);
      display: flex;
      flex-direction: column;
      padding: 9rem 5% 7rem;
      position: relative;
      overflow: hidden;
    }
    .hero-left::before {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: var(--leaf);
      opacity: 0.15;
    }
    .hero-left::after {
      content: '';
      position: absolute;
      top: 100px;
      left: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--mint);
      opacity: 0.1;
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(82, 183, 136, 0.2);
      color: var(--mint);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      border: 1px solid rgba(82, 183, 136, 0.3);
      margin-bottom: 1.8rem;
      width: fit-content;
    }
    .hero-tag-dot {
      font-size: 0.5rem;
      animation: pulse 2s infinite;
    }
    .hero h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.4rem, 4vw, 4.5rem);
      font-weight: 800;
      line-height: 1.08;
      color: var(--white);
      margin-bottom: 1.5rem;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--mint);
      font-weight: 300;
    }
    .hero-desc {
      font-size: 1rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.65);
      max-width: 420px;
      margin-bottom: 2.5rem;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .hero-stats {
      display: flex;
      gap: 2rem;
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .stat-num {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--mint);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
    }
   .hero-right{
    position:relative;
    width:100%;
    overflow:hidden;
    background:linear-gradient(160deg,#2d6a4f 0%,#1a3a2a 100%);
}
    .hero-img-mosaic {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      opacity: 0.6;
    }
    .hero-img-mosaic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .hero-img-mosaic img:hover {
      transform: scale(1.05);
      z-index: 2;
    }
    .mc1 {
      background: linear-gradient(135deg, #3d8b6f, #1a5240);
    }
    .mc2 {
      background: linear-gradient(135deg, #c47c2b, #8a5010);
    }
    .mc3 {
      background: linear-gradient(135deg, #1a5240, #0d2a1e);
    }
    .mc4 {
      background: linear-gradient(135deg, #52b788, #2d6a4f);
    }
    .hero-overlay-card {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(248, 243, 232, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1.5rem 2rem;
      border-radius: 16px;
      width: 78%;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .oc-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--mint), var(--leaf));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .oc-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--forest);
      margin-bottom: 0.25rem;
    }
    .oc-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .oc-badge {
      margin-left: auto;
      background: var(--terracotta);
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.35rem 0.8rem;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* INTRO STRIP */
    .intro-strip {
      background: var(--mist);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .intro-strip p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--forest);
      max-width: 700px;
    }
    .intro-strip p strong {
      font-weight: 600;
      color: var(--leaf);
    }
    .strip-watermark {
      font-family: 'Fraunces', serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--forest);
      opacity: 0.06;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    /* ABOUT */
    .about-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 5rem;
      align-items: start;
    }
    .big-quote {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-style: italic;
      font-weight: 300;
      color: var(--leaf);
      line-height: 1.6;
      padding-left: 1.5rem;
      border-left: 3px solid var(--mint);
      margin-bottom: 2rem;
    }
    .about-body {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .founder-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--white);
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      margin-top: 2rem;
      border: 1px solid var(--border);
    }
    .founder-card img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .founder-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--forest);
    }
    .founder-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .about-visual {
      position: relative;
    }
    .about-card-main {
      background: linear-gradient(135deg, var(--forest) 0%, #0e2018 100%);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
      position: relative;
      overflow: hidden;
    }
    .about-card-main::before {
      content: '✝';
      position: absolute;
      top: -20px;
      right: 20px;
      font-size: 8rem;
      color: var(--white);
      opacity: 0.04;
    }
    .acm-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 0.5rem;
    }
    .acm-date {
      font-family: 'Fraunces', serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--white);
      line-height: 1;
    }
    .acm-date span {
      font-size: 1rem;
      font-style: italic;
      font-weight: 300;
      display: block;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.3rem;
    }
    .acm-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 1.5rem 0;
    }
    .acm-text {
      font-size: 0.88rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.6);
    }
    .acm-text strong {
      color: var(--mint);
    }
    .about-mini-card {
      position: absolute;
      bottom: -1.5rem;
      right: -1.5rem;
      background: var(--mint);
      border-radius: 14px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 12px 32px rgba(82, 183, 136, 0.4);
      text-align: center;
    }
    .amc-num {
      font-family: 'Fraunces', serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--forest);
      line-height: 1;
    }
    .amc-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(26, 58, 42, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* SERVICES */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 3.5rem;
    }
    .service-card {
      background: var(--white);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid var(--border);
      transition: transform 0.35s, box-shadow 0.35s;
      position: relative;
      overflow: hidden;
      cursor: default;
    }
    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--leaf), var(--mint));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s;
    }
    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }
    .service-card:hover::before {
      transform: scaleX(1);
    }
    .service-num {
      font-family: 'Fraunces', serif;
      font-size: 3rem;
      font-weight: 800;
      color: var(--border);
      line-height: 1;
      margin-bottom: 1rem;
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
    }
    .service-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .service-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--forest);
      margin-bottom: 0.6rem;
      padding-right: 3rem;
    }
    .service-title em {
      font-style: italic;
      color: var(--leaf);
      font-family: 'Fraunces', serif;
    }
    .service-desc {
      font-size: 0.86rem;
      line-height: 1.7;
      color: var(--text-muted);
    }

    /* MVV */
    .mvv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .mvv-panel {
      padding: 3.5rem;
      position: relative;
      overflow: hidden;
    }
    .mvv-panel:nth-child(1) {
      background: var(--forest);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .mvv-panel:nth-child(2) {
      background: var(--leaf);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .mvv-panel:nth-child(3) {
      background: var(--mist);
      grid-column: span 2;
      border-top: 1px solid var(--border);
    }
    .mvv-panel::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      opacity: 0.08;
      background: var(--mint);
    }
    .mvv-icon {
      font-size: 2.5rem;
      margin-bottom: 1.2rem;
    }
    .mvv-label {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 0.8rem;
    }
    .mvv-panel:nth-child(3) .mvv-label {
      color: var(--forest);
    }
    .mvv-text {
      font-size: 0.92rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.65);
    }
    .mvv-panel:nth-child(3) .mvv-text {
      color: var(--text-muted);
    }
    .valeurs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

    // ─── EMAILJS CONFIGURATION ───
    // 1) Créez un compte sur https://www.emailjs.com/
    // 2) Créez un Email Service
    // 3) Créez un Email Template avec ces variables :
    //    {{from_name}}, {{from_email}}, {{reply_to}}, {{subject}}, {{message}}, {{to_name}}
    // 4) Remplacez les 3 valeurs ci-dessous.
    const EMAILJS_PUBLIC_KEY = "moflt-3aJiNMVok9G";
    const EMAILJS_SERVICE_ID = "service_tei73ml";
    const EMAILJS_TEMPLATE_ID = "template_oa3g3ad";

    if (window.emailjs) {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }

    // ─── NAVIGATION SPA SIMPLE ───
    const app = document.getElementById('app');
    const footerTemplate = document.getElementById('footer-tpl');
    const navLinks = document.getElementById('navLinks');
    const hamburger = document.getElementById('hamburger');
    const navbar = document.getElementById('navbar');

    function navigate(page) {
      const targetPage = pages[page] ? page : 'home';

      app.classList.add('fading');

      setTimeout(() => {
        app.innerHTML = pages[targetPage] + footerTemplate.innerHTML;
        app.classList.remove('fading');

        document.querySelectorAll('[data-page]').forEach(link => {
          link.classList.toggle('active', link.dataset.page === targetPage);
        });

        navLinks.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');

        window.scrollTo({ top: 0, behavior: 'smooth' });
        initReveal();
        initContactForm();
      }, 120);
    }

    // ─── MENU MOBILE ───
    hamburger.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', String(isOpen));
    });

    // ─── NAVBAR SHADOW ───
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 10);
    });

    // ─── ANIMATION REVEAL ───
    function initReveal() {
      const items = document.querySelectorAll('.reveal');

      if (!('IntersectionObserver' in window)) {
        items.forEach(item => item.classList.add('visible'));
        return;
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      items.forEach(item => observer.observe(item));
    }

    // ─── BOUTONS DE DON ───
    function selectAmt(button) {
      document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    // ─── FORMULAIRE CONTACT + EMAILJS ───
    function initContactForm() {
      const form = document.getElementById('cForm');
      if (!form) return;

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const status = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');
        const successBox = document.getElementById('successBox');
        const replyTo = document.getElementById('replyTo');
        const emailInput = document.getElementById('email');

        status.style.display = 'none';
        status.textContent = '';

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (!window.emailjs) {
          showFormStatus("Le script EmailJS n'est pas chargé. Vérifiez votre connexion Internet.", "error");
          return;
        }

        if (
          EMAILJS_PUBLIC_KEY === "VOTRE_PUBLIC_KEY" ||
          EMAILJS_SERVICE_ID === "VOTRE_SERVICE_ID" ||
          EMAILJS_TEMPLATE_ID === "VOTRE_TEMPLATE_ID"
        ) {
          showFormStatus("EmailJS n'est pas encore configuré. Remplacez PUBLIC_KEY, SERVICE_ID et TEMPLATE_ID dans le script.", "error");
          return;
        }

        replyTo.value = emailInput.value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Envoi en cours...";

        try {
          await emailjs.sendForm("service_5hi3xjr", EMAILJS_TEMPLATE_ID, form);

          form.style.display = 'none';
          successBox.style.display = 'block';
          form.reset();
        } catch (error) {
          console.error("Erreur EmailJS complète :", error);
          console.error("Status :", error.status);
          console.error("Text :", error.text);

          showFormStatus(
            "Erreur EmailJS : " + (error.text || "Vérifiez votre template EmailJS."),
            "error"
          );
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "✉️ Envoyer mon message";
        }
      });
    }

    function showFormStatus(message, type) {
      const status = document.getElementById('formStatus');
      if (!status) return;

      status.style.display = 'block';
      status.textContent = message;
      status.style.color = type === 'error' ? '#d4572a' : '#2d6a4f';
      status.style.background = type === 'error' ? 'rgba(212,87,42,0.08)' : 'rgba(82,183,136,0.10)';
      status.style.border = type === 'error' ? '1px solid rgba(212,87,42,0.25)' : '1px solid rgba(82,183,136,0.25)';
      status.style.borderRadius = '10px';
      status.style.padding = '0.85rem 1rem';
    }

    function resetContactForm() {
      const form = document.getElementById('cForm');
      const successBox = document.getElementById('successBox');

      if (form) form.style.display = 'block';
      if (successBox) successBox.style.display = 'none';
    }

    // ─── LOADER + PAGE INITIALE ───
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => loader.classList.add('hidden'), 350);
    });

    navigate('home');
  </script>
</body>
